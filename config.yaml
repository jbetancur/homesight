database:
  path: ./data/homesight.db

mqtt:
  # Optional: Specify a single broker URL for manual configuration
  # If empty, HomeSight auto-discovers ALL MQTT brokers on the network via mDNS (_mqtt._tcp)
  broker_url: ""  # Leave empty for auto-discovery (recommended)

  # Credentials (applied to all discovered brokers)
  username: ""
  password: ""

prometheus:
  url: http://localhost:9090

# Web Search Configuration (for document discovery)
# For production use, Bing Web Search API is STRONGLY recommended
search:
  # Bing Web Search API key (optional but recommended)
  # Get free tier: https://portal.azure.com -> Create "Bing Search v7" resource
  # Free tier: 1,000 searches/month, 3 searches/second
  # Copy the API key from the resource's "Keys and Endpoint" page
  bing_api_key: ""
  brave_api_key: ""  # Brave Search API key (optional, 2,000 searches/month free)

  # Background vendor documentation indexer (crawls manufacturer sites weekly)
  enable_vendor_indexer: true
  vendor_refresh_days: 7  # Days between full index refreshes

rag:
  # Document ingestion batch sizes - tune these to balance between throughput and CPU usage
  # Smaller batches = lower CPU spike but slower ingestion
  # Larger batches = faster ingestion but higher CPU spike
  batch_size_documents: 3      # For PDF/official documentation ingestion
  batch_size_community: 2      # For community source (forum/reddit/etc) ingestion

  # Known manufacturer documentation URL patterns
  # These are checked before LLM to ensure reliability and provide direct access to official manuals
  # Add more manufacturers here as needed - format is manufacturer_name -> base_url and product models
  manufacturers:
    Aqara:
      base_url: "https://cdn.aqara.com/cdn/website/mainland/static/docs"
      patterns:
        # Maps product model IDs to known PDF filenames
        "SJCGQ11LM": "Water-Leak-Sensor_Manuals_EU.pdf"
        # Add more models as discovered:
        # "MODEL_ID": "filename.pdf"
    # Add more manufacturers below:
    Zooz:
      base_url: "https://manufacturer.com/path/to/docs"
      patterns:
        "ZSE42": "https://www.support.getzooz.com/kb/article/2240-zse42-water-leak-xs-sensor-user-manual"

# Task queue configuration for background operations
queues:
  # Discovery: PDF fetching, document parsing (high throughput, low CPU)
  discovery:
    max_concurrent: 2          # Fetch 2 PDFs concurrently
    max_queue_depth: 10        # Buffer up to 10 pending devices
    cpu_threshold: 0.80        # Don't fetch if CPU >80%
    memory_threshold: 0.85     # Don't fetch if memory >85%

  # Ingestion: Embedding generation, ChromaDB writes (medium throughput, high CPU)
  ingestion:
    max_concurrent: 2          # Process 2 documents concurrently
    max_queue_depth: 5         # Keep small to avoid memory bloat
    cpu_threshold: 0.85        # Allow higher CPU (embedding intensive)
    memory_threshold: 0.80     # Strict on memory

  # Analysis: OpenAI API calls (low throughput, very high latency)
  analysis:
    max_concurrent: 4          # OpenAI API limit
    max_queue_depth: 20        # Buffer incidents
    cpu_threshold: 0.90        # Don't limit based on CPU
    memory_threshold: 0.90     # Don't limit based on memory

ai:
  openai_api_key: ""

  # LLM Configuration
  llm:
    # Chat mode: explicit config for user-facing chat
    # "cloud" = OpenAI gpt-4o-mini (high quality, function calling, data to cloud)
    # "local" = Local Llama 3.2 (private, limited quality, no external calls)
    chat_mode: "local"  # Privacy-first: all chat stays on your machine

    # Local LLM settings
    # 3B: Fast, smaller, lower quality
    # 8B: Slower, larger, much better quality (recommended for privacy-first chat)
    local:
      model_path: "/home/homesight/models/llama-3.1-8b-instruct.gguf"
      # Pre-download model with: scripts/download-model.sh

      # Runtime settings
      n_ctx: 4096          # Context window size
      n_threads: 8         # CPU threads (auto-detect based on CPU cores)
      n_gpu_layers: 0      # 0 = CPU only, 35+ = full GPU (if CUDA available)
      temperature: 0.7     # Sampling temperature (0.0-1.0)

    # OpenAI settings
    # Used for: chat (if chat_mode="cloud"), knowledge generation, incident analysis
    openai:
      model: "gpt-4o-mini" 

    # Concurrency settings (for knowledge generation and analysis)
    inference:
      max_concurrent_tasks: 4    # Semaphore limit for concurrent analyze/generate requests

api:
  addr: :8080

# Backend URL for AI sidecar to reach the Go API
# Use your actual server IP address
# For Docker: use host.docker.internal:8080 (works on WSL2, Docker Desktop Mac/Windows)
# For network: use your actual IP like 10.0.20.175:8080
backend_url: "http://10.0.20.175:8080"

integrations:
  matter: true   # Auto-discovers Matter devices via mDNS (requires native network)
  zigbee: true   # Requires MQTT broker with Zigbee2MQTT
  mqtt: true     # General MQTT device support + MQTT discovery
  lan: true      # Auto-discovers Shelly, Tasmota, ESPHome via mDNS (requires native network)
  zwave: true    # Z-Wave devices via Z-Wave JS

zwave:
  websocket_url: "ws://localhost:3001"  # Z-Wave JS WebSocket API
  auto_heal: true                        # Automatically heal network nightly
  heal_hour: 3                          # Hour to perform heal (3 = 3 AM)

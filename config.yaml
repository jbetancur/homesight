database:
  path: ./data/homesight.db

mqtt:
  # Optional: Specify a single broker URL for manual configuration
  # If empty, HomeSight auto-discovers ALL MQTT brokers on the network via mDNS (_mqtt._tcp)
  broker_url: ""  # Leave empty for auto-discovery (recommended)

  # Credentials (applied to all discovered brokers)
  username: ""
  password: ""

prometheus:
  url: http://localhost:9090

rag:
  # Document ingestion batch sizes - tune these to balance between throughput and CPU usage
  # Smaller batches = lower CPU spike but slower ingestion
  # Larger batches = faster ingestion but higher CPU spike
  batch_size_documents: 3      # For PDF/official documentation ingestion
  batch_size_community: 2      # For community source (forum/reddit/etc) ingestion

ai:
  service_url: http://localhost:8001
  openai_api_key: ""

  # LLM Configuration
  llm:
    provider: "hybrid"  # Hybrid: OpenAI for chat/analysis, local for fallback

    # Local LLM settings (Llama 3.2 3B - no auth required)
    # For 8B: Change repo_id to bartowski/Llama-3.2-8B-Instruct-GGUF and set HF_TOKEN env var
    local:
      model_path: "./models/llama-3.2-3b-instruct.gguf"
      auto_download: true  # Automatically download model if not found

      # Model source for auto-download (HuggingFace)
      # 3B model works without authentication, 8B requires HF_TOKEN
      download_source:
        repo_id: "bartowski/Llama-3.2-3B-Instruct-GGUF"
        filename: "Llama-3.2-3B-Instruct-Q4_K_M.gguf"

      # Runtime settings
      n_ctx: 4096          # Context window size
      n_threads: 4         # CPU threads (auto-detect based on CPU cores)
      n_gpu_layers: 0      # 0 = CPU only, 35+ = full GPU (if CUDA available)
      temperature: 0.7     # Sampling temperature (0.0-1.0)

    # OpenAI settings (for document discovery only)
    openai:
      model: "gpt-4o-mini"
      fallback: false    # Don't fallback to OpenAI for chat

    # Inference concurrency settings
    inference:
      max_worker_threads: 4      # ThreadPoolExecutor workers for LLM inference
      max_concurrent_tasks: 4    # Semaphore limit for concurrent analyze requests

api:
  addr: :8080

# Backend URL for AI sidecar to reach the Go API
# Use host.docker.internal which works on WSL2, Docker Desktop Mac/Windows
backend_url: "http://host.docker.internal:8080"

integrations:
  matter: true   # Auto-discovers Matter devices via mDNS (requires native network)
  zigbee: true   # Requires MQTT broker with Zigbee2MQTT
  mqtt: true     # General MQTT device support + MQTT discovery
  lan: true      # Auto-discovers Shelly, Tasmota, ESPHome via mDNS (requires native network)

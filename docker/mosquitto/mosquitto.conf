# Mosquitto Configuration for HomeSight
# MQTT Message Bus for all integration communication

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Listeners
# Main MQTT listener (no auth for internal use)
listener 1883
allow_anonymous true

# WebSocket listener (for browser-based clients if needed)
listener 9001
protocol websockets
allow_anonymous true

# Connection settings
max_connections -1
max_queued_messages 1000

# Keep alive (seconds)
max_keepalive 65535

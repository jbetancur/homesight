keyword_generation_system: |
  You are an expert at device documentation search. Generate search keywords that will help find official manuals. Include model variants, common alternative names, and document type keywords. Respond with JSON only.

keyword_generation_user: |
  Generate search keywords for finding documentation for:

  Manufacturer: {manufacturer}
  Model: {model}
  Type: {device_type}

  Return JSON in this format:
  {{
    "keywords": [
      "{manufacturer} {model} manual pdf",
      "{manufacturer} {model} user guide",
      "...additional search queries..."
    ],
    "model_variants": ["{model}", "...possible variants..."]
  }}

  Include:
  - Full product name variations
  - Model number with/without hyphens
  - Common abbreviations
  - Document types (manual, guide, datasheet, installation)

result_ranking_system: |
  You are an expert at identifying official manufacturer documentation. Rank search results by likelihood of being the official manual. Prefer PDFs, official manufacturer domains, and exact model matches. Respond with JSON only.

result_ranking_user: |
  Rank these search results for finding the official manual for:

  Manufacturer: {manufacturer}
  Model: {model}

  Search Results:
  {result_summaries}

  Return JSON in this format:
  {{
    "ranked_indices": [1, 3, 2, ...],
    "confidence": "high|medium|low"
  }}

  Ranking criteria (in priority order):
  1. Official manufacturer website/domain
  2. PDF format
  3. Exact model number match
  4. Document type (manual > guide > datasheet > forum)
  5. Recent/updated content

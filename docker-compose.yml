services:
  prometheus:
    image: prom/prometheus:latest
    container_name: homesight-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    networks:
      - homesight

  ai-sidecar:
    build:
      context: .
      dockerfile: docker/ai-sidecar/Dockerfile
    image: homesight-ai-sidecar
    container_name: homesight-ai-sidecar
    ports:
      - "8001:8001"
    environment:
      - BACKEND_URL=http://host.docker.internal:8080
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - /var/lib/homesight/manuals:/root/.homesight/manuals:rw
      # Persist RAG database and downloaded models on the host so data
      # survives container recreation and large files need not be baked into
      # the image.
      - /var/lib/homesight/rag:/var/lib/homesight/rag:rw
      # Mount host models directory for Llama 3.2 3B model (~2GB)
      # Pre-download model to /home/homesight/models/ to avoid re-downloading on container restarts
      - /home/homesight/models:/home/homesight/models:rw
      - /etc/localtime:/etc/localtime:ro
      - /home/homesight/logs:/app/log:rw
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "ai-sidecar"
    restart: unless-stopped
    networks:
      - homesight
    # Allow container to reach host via host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # To give access to host devices (USB / serial), add 'devices' entries here or mount them at runtime.

  grafana:
    image: grafana/grafana:latest
    container_name: homesight-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - homesight

volumes:
  prometheus_data:
  grafana_data:

networks:
  homesight:
    driver: bridge

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: homesight-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    networks:
      - homesight

  ai-sidecar:
    build:
      context: .
      dockerfile: docker/ai-sidecar/Dockerfile
    image: homesight-ai-sidecar
    container_name: homesight-ai-sidecar
    ports:
      - "8001:8001"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ~/.homesight/manuals:/root/.homesight/manuals:rw
      # Persist RAG database and downloaded models on the host so data
      # survives container recreation and large files need not be baked into
      # the image.
      - ~/.homesight/rag:/var/lib/homesight/rag:rw
      # NOTE: Don't mount /app/models as it hides the Python package modules
      # - ~/.homesight/models:/app/models:rw
      - /etc/localtime:/etc/localtime:ro
      - ./.logs:/app/log:rw
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "ai-sidecar"
    restart: unless-stopped
    networks:
      - homesight
    # Allow container to reach host via host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # To give access to host devices (USB / serial), add 'devices' entries here or mount them at runtime.

volumes:
  prometheus_data:

networks:
  homesight:
    driver: bridge

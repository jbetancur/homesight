# Development overrides for hot-reloading
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# For AI Sidecar:
#   Python changes auto-reload via uvicorn --reload (no restart needed)
#
# For Go API:
#   Still requires rebuild: make rebuild-api && make dev-restart-api
#
# Quick commands:
#   make dev        - Start all services in dev mode
#   make dev-stop   - Stop dev mode

services:
  web-ui:
    # Override production image with Node.js for dev server
    build:
      context: .
      dockerfile: docker/web-ui/Dockerfile.dev
    # Mount source code for hot-reloading (React changes apply automatically)
    volumes:
      - ./web-ui:/app:rw
      - /app/node_modules
    # Vite dev server with HMR
    command: ["npm", "run", "dev"]
    ports:
      - "0.0.0.0:5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_HMR_HOST=${VITE_HMR_HOST:-localhost}

  ai-sidecar:
    # Mount source code for hot-reloading (Python changes apply automatically)
    volumes:
      - ./ai-sidecar:/app:rw
      - ./config.yaml:/etc/homesight/config.yaml:ro
      - /var/lib/homesight/manuals:/root/homesight/manuals:rw
      - /var/lib/homesight/rag:/var/lib/homesight/rag:rw
      - /home/homesight/models:/home/homesight/models:rw
      - /etc/localtime:/etc/localtime:ro
      - /home/homesight/logs:/app/log:rw
    # Use Gunicorn with reload for dev (automatically reloads on code changes)
    # --reload watches for file changes and restarts workers
    command: ["gunicorn", "-c", "gunicorn.conf.py", "main:app", "--reload"]
    environment:
      # Use 2 workers in dev for better performance (same as production)
      - GUNICORN_WORKERS=2
